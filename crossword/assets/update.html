{% extends "admin/challenges/update.html" %}

{% block value %}
	<div class="form-group mb-3">
		<label for="value"><b>Points</b><br>
			<small class="form-text text-muted">Points awarded upon solving</small>
		</label>
		<input type="number" class="form-control" name="value" value="{{ challenge.value }}" required>
	</div>

	<div class="card my-3 border border-primary border-opacity-50 shadow-sm bg-body">
		<div class="card-header bg-primary bg-opacity-10 py-2 px-3 fw-bold text-primary font-monospace d-flex justify-content-between align-items-center">
			<span><i class="fas fa-puzzle-piece me-2"></i>CROSSWORD PUZZLE CONFIGURATION</span>
			<span class="badge bg-primary font-monospace">{{ challenge.solution_word or 'KEYWORD' }}</span>
		</div>
		<div class="card-body">
			<div class="form-group mb-3">
				<label for="solution_word" class="fw-bold">Solution Word or Flag</label>
				<div class="form-text text-muted small mb-1">The secret keyword or flag the player submits (e.g. <code>CYBERDEFENSE</code> or <code>flag{crossword_win}</code>)</div>
				<input type="text" class="form-control font-monospace text-uppercase" name="solution_word" value="{{ challenge.solution_word }}">
			</div>

			<div class="form-group mb-0">
				<label for="clues_text" class="fw-bold">
					Clues &amp; Answers (One per line: <code>Question / Clue | Answer</code>)<br>
					<small class="form-text text-muted">
						Simply enter each question followed by <code>|</code> and its answer. No JSON or coordinates required!
					</small>
				</label>
				<textarea class="form-control font-monospace" name="clues_text" rows="8">{{ challenge.clues_text }}</textarea>
			</div>
		</div>
	</div>
{% endblock %}
