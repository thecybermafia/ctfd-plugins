{% extends "admin/challenges/create.html" %}

{% block type %}
	<input type="hidden" value="bingo" name="type" id="chaltype">
{% endblock %}

{% block value %}
	<div class="form-group mb-3">
		<label for="value"><b>Full Card Points</b><br>
			<small class="form-text text-muted">Base points awarded for solving the full Bingo card</small>
		</label>
		<input type="number" class="form-control" name="value" placeholder="e.g. 500" value="500" required>
	</div>

	<div class="form-row row mb-3">
		<div class="form-group col-md-4">
			<label for="grid_size"><b>Grid Size</b></label>
			<select class="form-control custom-select" name="grid_size">
				<option value="3">3 x 3 (9 Squares - Fast & Fun)</option>
				<option value="4">4 x 4 (16 Squares)</option>
				<option value="5" selected>5 x 5 (25 Squares - Classic)</option>
			</select>
		</div>
		<div class="form-group col-md-4">
			<label for="line_bonus"><b>Line Bonus (Points)</b></label>
			<input type="number" class="form-control" name="line_bonus" value="50" min="0">
			<small class="form-text text-muted">Per row, column, or diagonal</small>
		</div>
		<div class="form-group col-md-4">
			<label for="blackout_bonus"><b>Blackout Bonus</b></label>
			<input type="number" class="form-control" name="blackout_bonus" value="250" min="0">
			<small class="form-text text-muted">Extra bonus for full card</small>
		</div>
	</div>

	<div class="form-group mb-3">
		<label for="squares_text">
			<b>Bingo Squares (One per line: <code>Square Title | Flag</code>)</b><br>
			<small class="form-text text-muted">
				Simply list each square name and its required flag separated by <code>|</code>. No JSON required!
			</small>
		</label>
		<textarea class="form-control font-monospace" name="squares_text" rows="8" placeholder="Robots.txt | flag{robots}&#10;Base64 Decode | flag{base64}&#10;SQL Injection | flag{sqli}&#10;FREE SPACE | FREE">Robots.txt | flag{robots}
Base64 Decode | flag{base64}
SQL Injection | flag{sqli}
Rot13 Cipher | flag{rot13}
Port Scanner | flag{port_scan}
Cookie Monster | flag{cookie}
Exif Metadata | flag{exif}
Reverse Strings | flag{strings}
Buffer Overflow | flag{overflow}
Wireshark PCAP | flag{pcap}
Recover Inode | flag{inode}
Crack MD5 | flag{crack_md5}
FREE SPACE | FREE
XSS Alert | flag{xss}
RSA Factor | flag{rsa}
DNS Record | flag{dns}
Steganography | flag{stego}
SUID Privesc | flag{privesc}
API Fuzzing | flag{fuzz}
Git History | flag{git_leaks}
JWT Forgery | flag{jwt}
Zip Path Traversal | flag{zip}
IDOR Access | flag{idor}
Command Injection | flag{cmdi}
Grand Champion | flag{champion}</textarea>
	</div>
{% endblock %}
