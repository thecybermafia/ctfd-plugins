{% extends "challenge.html" %}

{% block input %}
<input id="challenge-id" class="challenge-id" type="hidden" value="{{ challenge.id }}">

<div class="image-upload-wrapper my-2" id="image-upload-container">
  
  <!-- Current Review Status Alert -->
  <div id="iu-status-alert" class="alert alert-secondary d-none mb-3" role="alert" style="background: rgba(8, 12, 18, 0.95); border: 1px solid var(--cyber-border-bright);">
    <div class="d-flex align-items-center">
      <i id="iu-status-icon" class="fas fa-info-circle fa-2x me-3 text-cyan"></i>
      <div>
        <h5 id="iu-status-title" class="alert-heading mb-1 font-monospace">Status</h5>
        <p id="iu-status-desc" class="mb-0 small text-light"></p>
        <p id="iu-status-feedback" class="mt-1 mb-0 fw-bold small text-light font-monospace"></p>
      </div>
    </div>
  </div>

  <!-- Previously Uploaded Image Preview (if any) -->
  <div id="iu-current-preview" class="text-center mb-3 d-none">
    <label class="form-label text-muted small d-block font-monospace">Submitted Telemetry Proof:</label>
    <a id="iu-preview-link" href="#" target="_blank">
      <img id="iu-preview-img" src="" alt="Submitted proof" class="img-thumbnail" style="max-height: 200px; border: 1px solid var(--cyber-cyan); background: var(--cyber-bg-surface);">
    </a>
  </div>

  <!-- Upload Form -->
  <div id="iu-upload-form-box">
    <div class="mb-3">
      <label for="iu-file-input" class="form-label fw-bold font-monospace" style="color: var(--cyber-cyan);">
        <i class="fas fa-upload me-1"></i> Upload Evidence / Screenshot
      </label>
      <input class="form-control" type="file" id="iu-file-input" accept="image/*,.pdf,.zip">
      <div class="form-text text-muted small font-monospace">
        Max size: {{ challenge.max_file_size_mb or 10 }}MB. Allowed formats: {{ challenge.allowed_extensions or 'png, jpg, jpeg, webp, gif' }}.
      </div>
    </div>

    <div class="mb-3">
      <label for="iu-notes" class="form-label fw-bold font-monospace" style="color: var(--cyber-cyan);">Execution Notes / Methodology (Optional)</label>
      <textarea class="form-control font-monospace" id="iu-notes" rows="2" placeholder="Document attack vector, methodology, or reproduction steps..."></textarea>
    </div>

    <div>
      <button id="iu-submit-btn" class="btn btn-primary w-100 py-2">
        <i class="fas fa-paper-plane me-1"></i> Submit for Mission Review
      </button>
    </div>
  </div>

</div>
{% endblock %}

{% block submit %}
<!-- Handled inside input container -->
{% endblock %}
