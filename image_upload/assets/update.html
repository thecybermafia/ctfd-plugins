{% extends "admin/challenges/update.html" %}

{% block value %}
	<div class="form-group">
		<label for="value">Points<br>
			<small class="form-text text-muted">Points awarded upon approval</small>
		</label>
		<input type="number" class="form-control" name="value" value="{{ challenge.value }}" required>
	</div>

	<div class="form-group">
		<label for="max_file_size_mb">Max File Size (MB)<br>
			<small class="form-text text-muted">Maximum allowed file size in megabytes</small>
		</label>
		<input type="number" class="form-control" name="max_file_size_mb" value="{{ challenge.max_file_size_mb }}" min="1" max="100">
	</div>

	<div class="form-group">
		<label for="allowed_extensions">Allowed Extensions<br>
			<small class="form-text text-muted">Comma-separated allowed file extensions</small>
		</label>
		<input type="text" class="form-control" name="allowed_extensions" value="{{ challenge.allowed_extensions }}">
	</div>
{% endblock %}
